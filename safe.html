<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Simulator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0f0f1a; color:white; font-family:sans-serif; min-height:100vh; overflow-x:hidden; }

/* ── CODE GATE ── */
#codeGate { position:fixed; inset:0; background:#0f0f1a; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
#codeGate h1 { font-size:28px; color:#ffd200; }
#codeGate p { color:#666; font-size:14px; text-align:center; max-width:320px; }
#codeInput2 { padding:12px 16px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:10px; color:white; font-size:16px; width:260px; text-align:center; outline:none; }
#codeInput2:focus { border-color:#ffd200; }
#codeSubmit2 { padding:12px 28px; background:linear-gradient(135deg,#ffd200,#f59e0b); border:none; border-radius:10px; color:#111; font-weight:bold; font-size:15px; cursor:pointer; }
#codeSubmit2:hover { opacity:.88; }
#codeErr { color:#f88; font-size:13px; min-height:16px; }

/* ── HUD ── */
#hud { position:fixed; top:0; left:0; right:0; background:rgba(0,0,0,.8); backdrop-filter:blur(8px); padding:10px 16px; z-index:100; display:none; flex-direction:column; gap:6px; }
#hudRow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.hstat { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:4px 12px; font-size:13px; white-space:nowrap; }
.hstat span { color:#ffd200; font-weight:bold; }
#healthBarWrap { width:100%; height:8px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden; }
#healthBar { height:100%; border-radius:4px; transition:width .2s; }

/* ── MAIN ── */
#main { padding-top:90px; display:flex; flex-direction:column; align-items:center; gap:20px; padding-bottom:60px; }

/* ── SAFE ── */
#safeArea { display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:20px; }
#safeEmoji { font-size:130px; cursor:pointer; user-select:none; transition:transform .08s; filter:drop-shadow(0 0 20px rgba(255,210,0,.3)); animation:float 3s ease-in-out infinite; }
#safeEmoji:active { transform:scale(.93); }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
#safeEmoji.shake { animation:shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
#rarityLabel { font-size:22px; font-weight:bold; letter-spacing:2px; }
#healthText { font-size:14px; color:#888; }
#skipBtn { padding:10px 22px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); border-radius:10px; color:#aaa; font-size:13px; cursor:pointer; transition:all .15s; }
#skipBtn:hover:not(:disabled) { background:rgba(255,255,255,.12); color:white; }
#skipBtn:disabled { opacity:.35; cursor:not-allowed; }
#skipTimer { font-size:11px; color:#555; }

/* ── DAMAGE POP ── */
.dmgpop { position:fixed; pointer-events:none; font-weight:bold; font-size:18px; color:#ff4444; animation:floatUp .8s forwards; z-index:999; }
.dmgpop.crit { color:#ffd200; font-size:24px; }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-60px)} }

/* ── ITEM DROP POPUP ── */
#dropPopup { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:5000; display:none; align-items:center; justify-content:center; }
#dropPopup.show { display:flex; }
#dropBox { background:#1a1a2e; border:2px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; width:min(360px,94vw); display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
#dropEmoji { font-size:60px; }
#dropName { font-size:20px; font-weight:bold; }
#dropRarity { font-size:13px; letter-spacing:1px; font-weight:bold; }
#dropValue { font-size:14px; color:#ffd200; }
.drop-btns { display:flex; gap:10px; width:100%; }
.drop-btn { flex:1; padding:11px; border:none; border-radius:10px; font-size:13px; font-weight:bold; cursor:pointer; transition:opacity .15s; }
.drop-btn.keep { background:#00ffcc; color:#111; }
.drop-btn.sell { background:#ef4444; color:white; }
.drop-btn:hover { opacity:.85; }

/* ── INVENTORY ── */
#invOverlay { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:4000; display:none; align-items:center; justify-content:center; }
#invOverlay.show { display:flex; }
#invBox { background:#1a1a2e; border:2px solid rgba(255,255,255,.12); border-radius:18px; width:min(520px,96vw); max-height:84vh; display:flex; flex-direction:column; }
#invHeader { padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
#invHeader h2 { font-size:17px; }
.inv-close { background:none; border:none; color:#888; font-size:20px; cursor:pointer; }
.inv-close:hover { color:white; }
#invGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px; overflow-y:auto; flex:1; }
.inv-cell { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; transition:background .15s; display:flex; flex-direction:column; align-items:center; gap:4px; }
.inv-cell:hover { background:rgba(255,255,255,.1); }
.inv-cell.shiny { border-color:rgba(255,215,0,.7); background:rgba(100,70,0,.2); animation:shinePulse 1.5s infinite; }
@keyframes shinePulse { 0%,100%{border-color:rgba(255,215,0,.5)} 50%{border-color:rgba(255,215,0,1)} }
.inv-emoji { font-size:26px; }
.inv-iname { font-size:10px; color:#ccc; }
.inv-val { font-size:11px; color:#ffd200; font-weight:bold; }
.inv-rar { font-size:9px; font-weight:bold; }
.inv-growth { font-size:9px; color:#86efac; }

/* ── SHOP ── */
#shopOverlay { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:4000; display:none; align-items:center; justify-content:center; }
#shopOverlay.show { display:flex; }
#shopBox { background:#1a1a2e; border:2px solid rgba(255,255,255,.12); border-radius:18px; width:min(420px,96vw); max-height:84vh; display:flex; flex-direction:column; }
#shopHeader { padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
#shopHeader h2 { font-size:17px; }
.shop-list { padding:14px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1; }
.shop-item { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.shop-item-info h4 { font-size:14px; color:white; margin:0 0 3px; }
.shop-item-info p { font-size:11px; color:#666; margin:0; }
.shop-buy-btn { padding:8px 16px; border:none; border-radius:8px; background:linear-gradient(135deg,#ffd200,#f59e0b); color:#111; font-weight:bold; font-size:12px; cursor:pointer; white-space:nowrap; }
.shop-buy-btn:hover { opacity:.85; }
.shop-buy-btn:disabled { opacity:.4; cursor:not-allowed; }

/* ── ACH ── */
#achOverlay { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:4000; display:none; align-items:center; justify-content:center; }
#achOverlay.show { display:flex; }
#achBox { background:#1a1a2e; border:2px solid rgba(255,255,255,.12); border-radius:18px; width:min(480px,96vw); max-height:84vh; display:flex; flex-direction:column; }
#achHeader { padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
#achHeader h2 { font-size:17px; }
#achGrid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px; overflow-y:auto; }
.ach2 { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:10px 12px; }
.ach2.done { border-color:rgba(244,114,182,.5); background:rgba(244,114,182,.08); }
.ach2-icon { font-size:20px; }
.ach2-name { font-size:12px; font-weight:bold; color:#aaa; margin:4px 0 2px; }
.ach2-name.done { color:#f472b6; }
.ach2-desc { font-size:11px; color:#555; }

/* ── CODES ── */
#codesCard { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:16px 20px; width:min(440px,92vw); }
#codesCard h3 { font-size:12px; color:#777; text-transform:uppercase; letter-spacing:1px; margin:0 0 10px; }
.code-row2 { display:flex; gap:8px; }
#codeInput3 { flex:1; padding:9px 12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:8px; color:white; font-size:14px; }
#codeSubmit3 { padding:9px 16px; background:linear-gradient(135deg,#ffd200,#f59e0b); border:none; border-radius:8px; color:#111; font-weight:bold; cursor:pointer; }
#codeStatus2 { font-size:12px; color:#555; margin-top:6px; }

/* ── BOTTOM BAR ── */
#bottomBar { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,.8); border-top:1px solid rgba(255,255,255,.08); padding:8px 16px; display:none; gap:10px; justify-content:center; align-items:center; z-index:100; flex-wrap:wrap; }
.bb-btn { padding:7px 16px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.07); border-radius:8px; color:#ccc; font-size:12px; cursor:pointer; transition:background .15s; }
.bb-btn:hover { background:rgba(255,255,255,.14); color:white; }
#saveStatus2 { font-size:11px; color:#555; }

/* ── SETTINGS ── */
#settingsOverlay { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:4000; display:none; align-items:center; justify-content:center; }
#settingsOverlay.show { display:flex; }
#settingsBox { background:#1a1a2e; border:2px solid rgba(255,255,255,.12); border-radius:18px; width:min(380px,96vw); padding:24px; display:flex; flex-direction:column; gap:16px; }
#settingsBox h2 { font-size:17px; margin:0; }
.setting-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.setting-row:last-child { border-bottom:none; }
.setting-info h4 { font-size:14px; margin:0 0 3px; }
.setting-info p { font-size:11px; color:#555; margin:0; }
.toggle-btn { width:52px; height:28px; border-radius:14px; border:none; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
.toggle-btn.on  { background:#00ffcc; }
.toggle-btn.off { background:#333; }
.toggle-btn::after { content:''; position:absolute; top:4px; width:20px; height:20px; border-radius:50%; background:white; transition:left .2s; }
.toggle-btn.on::after  { left:28px; }
.toggle-btn.off::after { left:4px; }

/* ── TOAST ── */
#toast2 { position:fixed; bottom:50px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.9); border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:10px 20px; font-size:13px; z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw; text-align:center; }

/* ── NICK POPUP ── */
#nickOverlay2 { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:10000; display:none; align-items:center; justify-content:center; }
#nickOverlay2.show { display:flex; }
#nickBox2 { background:#1a1a2e; border:2px solid #ffd200; border-radius:16px; padding:28px 24px; width:min(340px,90vw); display:flex; flex-direction:column; gap:14px; }
#nickBox2 h2 { margin:0; color:#ffd200; font-size:20px; text-align:center; }
#nickInput2 { padding:12px 14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:10px; color:white; font-size:15px; outline:none; }
#nickInput2:focus { border-color:#ffd200; }
#nickSaveBtn2 { padding:12px; background:linear-gradient(135deg,#ffd200,#f59e0b); border:none; border-radius:10px; color:#111; font-weight:bold; font-size:14px; cursor:pointer; }
#nickErr2 { color:#f88; font-size:12px; min-height:14px; text-align:center; }

/* ── LEADERBOARD ── */
#lbOverlay2 { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:4000; display:none; align-items:center; justify-content:center; }
#lbOverlay2.show { display:flex; }
#lbBox2 { background:#1a1a2e; border:2px solid rgba(255,255,255,.12); border-radius:18px; width:min(400px,96vw); max-height:85vh; display:flex; flex-direction:column; }
#lbHeader2 { padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
.lb2-row { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid rgba(255,255,255,.05); }
.lb2-row.me { background:rgba(255,210,0,.08); }
.lb2-rank { font-size:16px; width:32px; text-align:center; }
.lb2-name { flex:1; font-size:13px; }
.lb2-val  { font-size:13px; color:#ffd200; font-weight:bold; }

/* ── PET SYSTEM ── */
#petOverlay { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:4000; display:none; align-items:center; justify-content:center; }
#petOverlay.show { display:flex; }
#petBox { background:#1a1a2e; border:2px solid rgba(255,255,255,.12); border-radius:18px; width:min(540px,96vw); max-height:88vh; display:flex; flex-direction:column; }
#petHeader { padding:14px 18px 0; display:flex; gap:0; border-bottom:1px solid rgba(255,255,255,.08); }
.pet-tab { padding:10px 18px; background:none; border:none; color:#555; font-size:13px; font-weight:bold; cursor:pointer; border-bottom:2px solid transparent; }
.pet-tab.active { color:#ffd200; border-bottom-color:#ffd200; }
#petClose { margin-left:auto; background:none; border:none; color:#888; font-size:20px; cursor:pointer; padding:0 4px; }
#petContent { padding:14px; overflow-y:auto; flex:1; }
.pet-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.pet-cell { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; transition:background .15s; }
.pet-cell:hover { background:rgba(255,255,255,.1); }
.pet-cell.equipped { border-color:#ffd200; background:rgba(255,210,0,.08); }
.pet-emoji { font-size:26px; }
.pet-name { font-size:10px; color:#ccc; }
.pet-stats { font-size:10px; color:#ffd200; font-weight:bold; }
.pet-rar { font-size:9px; font-weight:bold; }
.egg-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.egg-cell { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:14px 6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; }
.egg-emoji { font-size:36px; animation:eggWobble 2s ease-in-out infinite; }
@keyframes eggWobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
.egg-rar { font-size:10px; font-weight:bold; }
.egg-count { font-size:11px; color:#888; }
.open-btns { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
.open-btn { padding:5px 10px; border:none; border-radius:7px; font-size:11px; font-weight:bold; cursor:pointer; background:rgba(255,210,0,.2); border:1px solid rgba(255,210,0,.4); color:#ffd200; }
.open-btn:hover { background:rgba(255,210,0,.35); }
.open-btn:disabled { opacity:.35; cursor:not-allowed; }
.open-btn.gem-btn { background:rgba(244,114,182,.15); border-color:rgba(244,114,182,.4); color:#f472b6; }

/* ── EGG OPEN ANIMATION ── */
#eggOpenOverlay { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:9500; display:none; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
#eggOpenOverlay.show { display:flex; }
#eggOpenEmoji { font-size:100px; }
#eggOpenEmoji.wobble { animation:eggWobble2 .4s ease-in-out 3; }
#eggOpenEmoji.crack  { animation:eggCrack .5s ease-in-out forwards; }
@keyframes eggWobble2 { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
@keyframes eggCrack   { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(0);opacity:0} }
#eggResultGrid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:500px; }
.egg-result-card { background:#1e1e2e; border:2px solid rgba(255,255,255,.2); border-radius:14px; padding:16px; text-align:center; min-width:100px; animation:popIn .4s ease; }
@keyframes popIn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
.erc-emoji { font-size:40px; }
.erc-name  { font-size:12px; color:#ccc; margin:4px 0 2px; }
.erc-rar   { font-size:11px; font-weight:bold; }
#eggOpenClose { padding:12px 28px; background:#ffd200; color:#111; border:none; border-radius:10px; font-weight:bold; font-size:14px; cursor:pointer; display:none; }

/* Rarity colors */
.rar-rare      { color:#60a5fa; }
.rar-superrare { color:#a78bfa; }
.rar-epic      { color:#c084fc; }
.rar-legendary { color:#fbbf24; }
.rar-mythic    { color:#f472b6; }
.rar-cosmic    { color:#67e8f9; }
.rar-celestial { color:#fde68a; background:linear-gradient(90deg,#fde68a,#fbbf24,#f472b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.rar-secret    { color:#111; background:linear-gradient(90deg,#ff0080,#8000ff,#00ffcc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* Back to menu */
#backToMenu { position:fixed; top:10px; right:12px; z-index:200; padding:6px 14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:8px; color:#888; font-size:12px; cursor:pointer; display:none; }
#backToMenu:hover { color:white; background:rgba(255,255,255,.14); }

</style>
</head>
<body>

<!-- CODE GATE -->
<div id="codeGate">
  <div style="font-size:70px;">🔒</div>
  <h1>Safe Simulator</h1>
  <p>Wpisz kod dostępu aby zagrać</p>
  <input type="text" id="codeInput2" placeholder="Wpisz kod..." maxlength="20">
  <div id="codeErr"></div>
  <button id="codeSubmit2" onclick="checkCode()">Wejdź</button>
  <a href="index.html" style="color:#555;font-size:12px;margin-top:8px;">← Wróć do menu</a>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hudRow">
    <div class="hstat">💰 <span id="hudCoins">0</span></div>
    <div class="hstat">⚔️ DMG: <span id="hudDmg">5</span></div>
    <div class="hstat">🍀 Luck: <span id="hudLuck">1x</span></div>
    <div class="hstat">📦 Zniszczone: <span id="hudSafes">0</span></div>
    <div class="hstat">💎 <span id="hudGems">0</span></div>
  </div>
  <div id="healthBarWrap"><div id="healthBar"></div></div>
</div>

<button id="backToMenu" onclick="window.location.href='index.html'">← Menu</button>

<!-- MAIN -->
<div id="main" style="display:none;">
  <div id="safeArea">
    <div id="rarityLabel"></div>
    <div id="safeEmoji" onclick="hitSafe()">🔒</div>
    <div id="healthText"></div>
    <button id="skipBtn" onclick="skipSafe()">⏭️ Pomiń sejf</button>
    <div id="skipTimer"></div>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
    <div id="codesCard">
      <h3>🎁 Kody</h3>
      <div class="code-row2">
        <input type="text" id="codeInput3" placeholder="Wpisz kod...">
        <button id="codeSubmit3" onclick="redeemCode2()">Użyj</button>
      </div>
      <div id="codeStatus2"></div>
    </div>
  </div>

  <div id="achCard" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 20px;width:min(440px,92vw);">
    <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleAch2()">
      <h3 style="font-size:12px;color:#777;text-transform:uppercase;letter-spacing:1px;margin:0;">🏆 Osiągnięcia</h3>
      <span id="achToggle2" style="color:#555;font-size:16px;">▼</span>
    </div>
    <div id="achGrid2" style="display:none;margin-top:10px;"></div>
  </div>
</div>

<!-- ITEM DROP POPUP -->
<div id="dropPopup">
  <div id="dropBox">
    <div id="dropEmoji"></div>
    <div id="dropName"></div>
    <div id="dropRarity"></div>
    <div id="dropValue"></div>
    <p id="dropShiny" style="color:#ffd700;font-size:12px;display:none;">✨ SHINY! Wartość x4!</p>
    <div class="drop-btns">
      <button class="drop-btn keep" onclick="keepItem()">📦 Zachowaj</button>
      <button class="drop-btn sell" onclick="sellItem()">💰 Sprzedaj</button>
    </div>
  </div>
</div>

<!-- INVENTORY -->
<div id="invOverlay">
  <div id="invBox">
    <div id="invHeader">
      <h2>📦 Inventory</h2>
      <span id="invCount" style="font-size:12px;color:#555;"></span>
      <button class="inv-close" onclick="closeInv()">✕</button>
    </div>
    <div id="invGrid"></div>
  </div>
</div>

<!-- SHOP -->
<div id="shopOverlay">

const ITEM_TIERS = [

const ITEM_BASE_VALUE = { rare:50, superrare:200, epic:1000, legendary:5000, mythic:20000, cosmic:100000, celestial:500000, secret:10000000 };

function rollItemTier() {
  const r = Math.random();
  let cum = 0;
  for (let i = 0; i < ITEM_TIERS.length; i++) {
    cum += ITEM_TIERS[i].w;
    if (r < cum) return i;
  }
  return 0;
}

// ── STATE
let ss = {
  coins:0, damage:5, luck:1, safesDestroyed:0, gems:0,
  inventory:[], usedCodes:{}, achDone:{},
  shopLevels:{ luck:0, dmg:0 },
  settings:{ autoSell:false, autoKeep:false },
  unlockedAutoSell:false, unlockedAutoKeep:false,
  sellRarities:{ rare:true, superrare:true, epic:false, legendary:false, mythic:false, cosmic:false, celestial:false, secret:false },
  // PET SYSTEM (jajka wkrótce)
  pets:[], equippedPetId:null, petBonuses:{ coinMult:1, luckBonus:0, dmgBonus:0 },
};

function migrateSS(s) {
  s.coins=s.coins||0; s.damage=s.damage||5; s.luck=s.luck||1;
  s.safesDestroyed=s.safesDestroyed||0; s.inventory=s.inventory||[];
  s.usedCodes=s.usedCodes||{}; s.achDone=s.achDone||{};
  s.shopLevels=s.shopLevels||{luck:0,dmg:0};
  s.gems=s.gems||0;
  s.settings=s.settings||{autoSell:false,autoKeep:false};
  s.unlockedAutoSell=s.unlockedAutoSell||false;
  s.unlockedAutoKeep=s.unlockedAutoKeep||false;
  s.sellRarities=s.sellRarities||{ rare:true, superrare:true, epic:false, legendary:false, mythic:false, cosmic:false, celestial:false, secret:false };
  s.pets=s.pets||[]; s.equippedPetId=s.equippedPetId||null;
  s.petBonuses=s.petBonuses||{ coinMult:1, luckBonus:0, dmgBonus:0 };
  s.eggs=s.eggs||{}; s.nick=s.nick||"";
  return s;
}

// ── CURRENT SAFE
let curSafe = null;
let skipCooldown = 0;
let skipInterval = null;
let pendingDrop = null;

function spawnSafe() {
  const luckBonus = ss.petBonuses ? ss.petBonuses.luckBonus : 0;
  const totalLuck = ss.luck + luckBonus;
  const roll = Math.random() / totalLuck;
  let cum = 0;
  let chosen = RARITIES[0];
  for (const r of RARITIES) {
    cum += r.chance;
    if (roll < cum) { chosen = r; break; }
  }
  curSafe = { ...chosen, curHp: chosen.hp };
  updateSafeUI();
}

function updateSafeUI() {
  if (!curSafe) return;
  const pct = (curSafe.curHp / curSafe.hp * 100).toFixed(1);
  document.getElementById("safeEmoji").textContent = curSafe.emoji;
  document.getElementById("rarityLabel").textContent = curSafe.name;
  document.getElementById("rarityLabel").className = "rar-" + curSafe.id;
  document.getElementById("healthText").textContent = Math.ceil(curSafe.curHp) + " / " + curSafe.hp + " HP";
  document.getElementById("healthBar").style.width = pct + "%";
  document.getElementById("healthBar").style.background = curSafe.hpColor;
}

window.hitSafe = function() {
  if (!curSafe || document.getElementById("dropPopup").classList.contains("show")) return;
  const dmgBonus = ss.petBonuses ? ss.petBonuses.dmgBonus : 0;
  const dmg = ss.damage + dmgBonus;
  curSafe.curHp -= dmg;
  spawnDmgPop(dmg);
  const em = document.getElementById("safeEmoji");
  em.classList.remove("shake"); void em.offsetWidth; em.classList.add("shake");
  if (curSafe.curHp <= 0) {
    ss.safesDestroyed++;
    const coinBonus = ss.petBonuses ? ss.petBonuses.coinMult : 1;
    ss.coins += Math.round(curSafe.hp * 0.5 * ss.luck * coinBonus);
    tryDropEgg();
    checkAch2();
    dropItem();
  } else {
    updateSafeUI();
  }
};

function dropItem() {
  const tierIdx = rollItemTier();
  const tierItems = (ITEMS[curSafe.id] || ITEMS.rare)[tierIdx] || (ITEMS[curSafe.id]||ITEMS.rare)[0];
  const item = tierItems[Math.floor(Math.random() * tierItems.length)];
  const baseVal = ITEM_BASE_VALUE[curSafe.id] || 50;
  const tierMult = ITEM_TIERS[tierIdx].mult;
  const isShiny = Math.random() < 0.01;
  const val = Math.round(baseVal * tierMult * (isShiny ? 4 : 1));

  pendingDrop = {
    emoji: item.e, name: item.n, rarity: curSafe.id, rarityName: curSafe.name,
    value: val, baseValue: baseVal, tierMult, isShiny,
    acquiredAt: Date.now(), id: Date.now() + Math.random(),
  };

  checkAch2();

  // Auto-sell — tylko jeśli to rarity jest zaznaczone do sprzedaży
  if (ss.settings.autoSell && ss.unlockedAutoSell && ss.sellRarities[curSafe.id]) {
    ss.coins += val;
    toast2("💰 Auto-sprzedano: " + item.n + " (" + curSafe.name + ") za " + fmt2(val) + "!");
    pendingDrop = null;
    updateHUD(); autoSave(); nextSafe(); return;
  }
  // Auto-keep — zachowuje gdy NIE jest w sellRarities lub auto-keep włączone
  if (ss.settings.autoKeep && ss.unlockedAutoKeep && !ss.sellRarities[curSafe.id]) {
    ss.inventory.push(pendingDrop);
    toast2("📦 Auto-zachowano: " + item.n + " (" + curSafe.name + ")!");
    pendingDrop = null;
    updateHUD(); autoSave(); nextSafe(); return;
  }
  // Auto-keep bez filtru
  if (ss.settings.autoKeep && ss.unlockedAutoKeep) {
    ss.inventory.push(pendingDrop);
    toast2("📦 Auto-zachowano: " + item.n + "!");
    pendingDrop = null;
    updateHUD(); autoSave(); nextSafe(); return;
  }

  // Show popup
  document.getElementById("dropEmoji").textContent = item.e + (isShiny?" ✨":"");
  document.getElementById("dropName").textContent = item.n;
  document.getElementById("dropRarity").textContent = curSafe.name + " (tier " + (tierIdx+1) + "/5)";
  document.getElementById("dropRarity").className = "rar-" + curSafe.id;
  document.getElementById("dropValue").textContent = "💰 " + fmt2(val) + " coinów";
  document.getElementById("dropShiny").style.display = isShiny ? "block" : "none";
  document.getElementById("dropPopup").classList.add("show");
  updateHUD(); autoSave();
}

window.keepItem = function() {
  if (!pendingDrop) return;
  ss.inventory.push(pendingDrop);
  pendingDrop = null;
  document.getElementById("dropPopup").classList.remove("show");
  toast2("📦 Przedmiot zachowany!");
  nextSafe();
};

window.sellItem = function() {
  if (!pendingDrop) return;
  ss.coins += pendingDrop.value;
  pendingDrop = null;
  document.getElementById("dropPopup").classList.remove("show");
  toast2("💰 Sprzedano za " + fmt2(ss.coins) + "!");
  updateHUD(); nextSafe();
};

function nextSafe() {
  curSafe = null;
  setTimeout(spawnSafe, 400);
}

// ── SKIP
window.skipSafe = function() {
  if (skipCooldown > 0) return;
  skipCooldown = 30;
  document.getElementById("skipBtn").disabled = true;
  updateSkipTimer();
  nextSafe();
  toast2("⏭️ Sejf pominięty!");
};

function updateSkipTimer() {
  if (skipInterval) clearInterval(skipInterval);
  skipInterval = setInterval(() => {
    skipCooldown--;
    if (skipCooldown <= 0) {
      skipCooldown = 0;
      document.getElementById("skipBtn").disabled = false;
      document.getElementById("skipTimer").textContent = "";
      clearInterval(skipInterval);
    } else {
      document.getElementById("skipTimer").textContent = "Cooldown: " + skipCooldown + "s";
    }
  }, 1000);
}

// ── DAMAGE POP
function spawnDmgPop(dmg) {
  const el = document.createElement("div");
  el.className = "dmgpop";

  el.style.top = "42%";

  setTimeout(() => el.remove(), 800);
}

window.openInv = function() { buildInvGrid(); document.getElementById("invOverlay").classList.add("show"); };
window.closeInv = function() { document.getElementById("invOverlay").classList.remove("show"); };

function buildInvGrid() {
  const grid = document.getElementById("invGrid");
  const countEl = document.getElementById("invCount");
  grid.innerHTML = "";
  countEl.textContent = ss.inventory.length + " przedmiotów";
  if (!ss.inventory.length) {
    grid.innerHTML = "<div style='grid-column:span 4;text-align:center;color:#555;padding:30px;'>Brak przedmiotów!</div>";
    return;
  }
  ss.inventory.forEach((item, idx) => {
    const growthPct = item.growthPct || 0;
    const currentVal = Math.round(item.value * (1 + growthPct * 0.01));
    const cell = document.createElement("div");
    cell.className = "inv-cell" + (item.isShiny ? " shiny" : "");
    cell.innerHTML = `
      <div class="inv-emoji">${item.emoji}${item.isShiny?"✨":""}</div>
      <div class="inv-iname">${item.name}</div>
      <div class="inv-rar rar-${item.rarity}">${item.rarityName}</div>
      <div class="inv-val">💰 ${fmt2(currentVal)}</div>
      <div class="inv-growth">+${growthPct}% wzrost</div>
    `;
    cell.onclick = () => {
      if (confirm("Sprzedać " + item.name + " za " + fmt2(currentVal) + " coinów?")) {
        ss.coins += currentVal;
        ss.inventory.splice(idx, 1);
        buildInvGrid(); updateHUD(); autoSave();
        toast2("💰 Sprzedano za " + fmt2(currentVal) + "!");
      }
    };
    grid.appendChild(cell);
  });
}

// Value growth — only while playing, no offline
setInterval(() => {
  ss.inventory.forEach(item => {
    item.growthPct = (item.growthPct || 0) + 1;

function buildShopList() {
  const list = document.getElementById("shopList");
  list.innerHTML = "";
  SHOP_ITEMS.forEach(item => {
    const lvl = ss.shopLevels[item.id] || 0;
    const cost = Math.round(item.baseCost * Math.pow(item.costMult, lvl));
    const div = document.createElement("div");
    div.className = "shop-item";
    div.innerHTML = `
      <div class="shop-item-info">
        <h4>${item.name} <span style="color:#555;font-size:11px;">(Lvl ${lvl})</span></h4>
        <p>${item.desc}</p>
      </div>
      <button class="shop-buy-btn" ${ss.coins<cost?"disabled":""} onclick="buyShopItem('${item.id}',${cost})">💰 ${fmt2(cost)}</button>
    `;
    list.appendChild(div);
  });
  document.getElementById("shopCoins").textContent = "💰 " + fmt2(ss.coins);
}

window.buyShopItem = function(id, cost) {
  if (ss.coins < cost) { toast2("Za mało coinów!"); return; }
  ss.coins -= cost;
  ss.shopLevels[id] = (ss.shopLevels[id]||0) + 1;
  if (id === "luck") ss.luck = parseFloat((ss.luck + 0.1).toFixed(2));
  if (id === "dmg")  ss.damage += 5;
  buildShopList(); updateHUD(); autoSave(); toast2("✅ Kupiono!");
};

  const rarityFilterHTML = ss.unlockedAutoSell ? `
    <div style="margin-top:10px;padding:10px;background:rgba(255,255,255,.04);border-radius:10px;">
      <div style="font-size:11px;color:#777;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">Które rarity AUTO-SELL (reszta → auto-keep):</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">

// ── FORMAT
function fmt2(n) {
  const SFX2 = [[1e18,"Q"],[1e15,"q"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"k"]];
  for (const [v,s] of SFX2) if (n>=v) return (n/v).toFixed(2)+s;
  return Math.round(n).toString();
}

const EGG_DROP_CHANCE = 0.10; // 10% z sejfu epic+

function tryDropEgg() {
  if (!curSafe) return;
  if (!EGG_RARITIES.includes(curSafe.id)) return;
  if (Math.random() > EGG_DROP_CHANCE) return;
  // Daj jajko tej samej rzadkości
  if (!ss.eggs) ss.eggs = {};
  ss.eggs[curSafe.id] = (ss.eggs[curSafe.id] || 0) + 1;
  toast2("🥚 Dostałeś " + curSafe.name + " jajko!");
  autoSave();
}

function recalcPetBonuses() {
  if (!ss.equippedPetId || !ss.pets || !ss.pets.length) {
    ss.petBonuses = { coinMult:1, luckBonus:0, dmgBonus:0 };
    return;
  }
  const pet = ss.pets.find(p => p.uid === ss.equippedPetId);
  if (!pet) { ss.petBonuses = { coinMult:1, luckBonus:0, dmgBonus:0 }; return; }
  ss.petBonuses = { coinMult: pet.coinMult, luckBonus: pet.luckBonus, dmgBonus: pet.dmgBonus };
}

function buildPetContent() {

function buildPetGrid(el) {
  if (!ss.pets || !ss.pets.length) {
    el.innerHTML = "<div style='text-align:center;color:#555;padding:40px;'>Brak petów — otwieraj jajka!</div>";
    return;
  }
  el.innerHTML = "<div class='pet-grid'></div>";
  const grid = el.querySelector(".pet-grid");
  ss.pets.forEach(pet => {
    const isEq = pet.uid === ss.equippedPetId;
    const cell = document.createElement("div");
    cell.className = "pet-cell" + (isEq?" equipped":"");
    const col = PET_COLORS[pet.rarity] || "#ccc";
    cell.innerHTML = `
      <div class="pet-emoji">${pet.emoji}</div>
      <div class="pet-name">${pet.name}</div>
      <div class="pet-rar" style="color:${col}">${pet.rarity.toUpperCase()}</div>
      <div class="pet-stats" style="font-size:9px;">💰${pet.coinMult}x 🍀+${pet.luckBonus} ⚔️+${pet.dmgBonus}</div>
      ${isEq?"<div style='font-size:9px;color:#ffd200;'>✓ Aktywny</div>":""}
    `;
    cell.onclick = () => {
      ss.equippedPetId = isEq ? null : pet.uid;
      recalcPetBonuses(); updateHUD(); autoSave(); buildPetContent();
      toast2(isEq ? "Pet zdjęty" : "✅ Wyposażono: " + pet.name + "!");

function buildEggGrid(el) {
  if (!ss.eggs) ss.eggs = {};
  const hasAny = EGG_RARITIES.some(r => (ss.eggs[r]||0) > 0);
  if (!hasAny) {
    el.innerHTML = "<div style='text-align:center;color:#555;padding:40px;'>Brak jajek — niszcz Epic+ sejfy!</div>";
    return;
  }
  el.innerHTML = "<div class='egg-grid'></div>";
  const grid = el.querySelector(".egg-grid");
  EGG_RARITIES.forEach(rar => {
    const count = ss.eggs[rar] || 0;
    if (count === 0) return;
    const col = PET_COLORS[rar];
    const cell = document.createElement("div");
    cell.className = "egg-cell";
    cell.innerHTML = `
      <div class="egg-emoji" style="filter:drop-shadow(0 0 8px ${col})">${EGG_EMOJIS[rar]||"🥚"}</div>

        <button class="open-btn" ${count<3?"disabled":""} onclick="openEggs('${rar}',3)">x3</button>
        <button class="open-btn gem-btn" ${ss.gems<150?"disabled":""} onclick="openEggs('${rar}',8)">x8 (150💎)</button>
      </div>
    `;
    grid.appendChild(cell);
  });
}

// ── EGG OPENING ANIMATION
window.openEggs = async function(rar, count) {
  const have = ss.eggs[rar] || 0;
  if (count === 8) {
    if (ss.gems < 150) { toast2("Za mało 💎! Potrzebujesz 150!"); return; }
    if (have < 1) { toast2("Brak jajek!"); return; }
    ss.gems -= 150;
    count = Math.min(8, have);
  } else {
    if (have < count) { toast2("Za mało jajek!"); return; }
  }
  ss.eggs[rar] -= count;
  document.getElementById("petOverlay").classList.remove("show");

  // Show animation
  const overlay = document.getElementById("eggOpenOverlay");
  const eggEl = document.getElementById("eggOpenEmoji");
  const resultGrid = document.getElementById("eggResultGrid");
  const closeBtn = document.getElementById("eggOpenClose");
  eggEl.textContent = EGG_EMOJIS[rar] || "🥚";
  resultGrid.innerHTML = "";
  closeBtn.style.display = "none";
  overlay.classList.add("show");

  // Wobble animation
  eggEl.classList.add("wobble");
  await sleep(1400);
  eggEl.classList.remove("wobble");
  eggEl.classList.add("crack");
  await sleep(500);
  eggEl.style.display = "none";

  // Hatch pets
  const pets = PET_DEFS[rar] || PET_DEFS.epic;
  for (let i = 0; i < count; i++) {
    const pet = pets[Math.floor(Math.random() * pets.length)];
    const newPet = { ...pet, uid: Date.now() + Math.random(), rarity: rar };
    ss.pets.push(newPet);
    // Show card with delay
    await sleep(300);
    const card = document.createElement("div");
    card.className = "egg-result-card";
    card.style.borderColor = PET_COLORS[rar] || "#fff";
    card.innerHTML = `
      <div class="erc-emoji">${pet.emoji}</div>
      <div class="erc-name">${pet.name}</div>
      <div class="erc-rar" style="color:${PET_COLORS[rar]}">${rar.toUpperCase()}</div>
      <div style="font-size:9px;color:#ffd200;">💰${pet.coinMult}x 🍀+${pet.luckBonus} ⚔️+${pet.dmgBonus}</div>
    `;
    resultGrid.appendChild(card);
  }

  closeBtn.style.display = "block";
  recalcPetBonuses(); autoSave();
  checkAch2();
};

window.closeEggOpen = function() {
  document.getElementById("eggOpenOverlay").classList.remove("show");
  document.getElementById("eggOpenEmoji").style.display = "block";
  document.getElementById("eggOpenEmoji").classList.remove("crack");
  document.getElementById("petOverlay").classList.add("show");
  switchPetTab("pets");
};

  const nick = document.getElementById("nickInput2").value.trim();
  const err = document.getElementById("nickErr2");
  if (!nick || nick.length < 2) { err.textContent="Min 2 znaki!"; return; }
  if (nick.length > 20) { err.textContent="Max 20 znaków!"; return; }
  playerNick2 = nick;
  ss.nick = nick;
  document.getElementById("nickOverlay2").classList.remove("show");
  autoSave(); updateLbNick();
  toast2("✅ Nick: " + nick);
};
document.getElementById("nickInput2").addEventListener("keydown", e => { if(e.key==="Enter") saveNick2(); });

function updateLbNick() {
  if (currentUser && ss.nick) {
    setDoc(doc(db,"safeLeaderboard",currentUser.uid), {
      nick: ss.nick,
      safesDestroyed: ss.safesDestroyed,
      coins: ss.coins,
      pets: ss.pets ? ss.pets.length : 0,
    }, { merge:true }).catch(()=>{});
  }
}

// ── LEADERBOARD
window.openLb2 = function() {
  document.getElementById("lbOverlay2").classList.add("show");
  loadLb2();
};

window.loadLb2 = async function() {
  const field = document.getElementById("lbField2").value;
  const listEl = document.getElementById("lbList2");
  const statusEl = document.getElementById("lbStatus2");
  listEl.innerHTML = "";
  statusEl.textContent = "Ładowanie...";
  try {
    const q = query(collection(db,"safeLeaderboard"), orderBy(field,"desc"), limit(20));
    const snap = await getDocs(q);
    const medals = ["🥇","🥈","🥉"];
    snap.docs.forEach((d, i) => {
      const data = d.data();
      const isMe = currentUser && d.id === currentUser.uid;
      const row = document.createElement("div");
      row.className = "lb2-row" + (isMe?" me":"");
      const val = field==="coins" ? fmt2(data.coins||0)+" coinów" : field==="pets" ? (data.pets||0)+" petów" : (data.safesDestroyed||0)+" sejfów";
      row.innerHTML = `<span class="lb2-rank">${medals[i]||"#"+(i+1)}</span><span class="lb2-name">${data.nick||"???"}</span><span class="lb2-val">${val}</span>`;
      listEl.appendChild(row);
    });
    statusEl.textContent = snap.docs.length ? "" : "Brak danych";
  } catch(e) { statusEl.textContent = "Błąd: " + e.message; }
};

// ── START
function startGame() {
  document.getElementById("main").style.display = "flex";
  document.getElementById("hud").style.display  = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  document.getElementById("backToMenu").style.display = "block";
  if (!ss.nick) {
    document.getElementById("nickOverlay2").classList.add("show");
    document.getElementById("nickInput2").focus();
  }
  recalcPetBonuses();
  updateHUD();
  buildAchGrid2();
  spawnSafe();
}

// ── AUTH
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user && codeUnlocked) {
    await loadGame();
    startGame();
  }
});

setInterval(autoSave, 30000);
</script>
